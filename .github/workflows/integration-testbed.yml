name: Integration Testbed

# Combat-mode testing of every project feature: an isolated three-container
# stand (Client + DPI midbox router + target server) on two private bridge
# networks. The DPI midbox RST-injects blocked domains like a real inline
# DPI (per-packet string match in FORWARD); the client container routes all
# target traffic THROUGH the midbox and runs the full ncp feature matrix.
# Host network is never touched.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docker/**'
      - 'scripts/testbed/**'
      - 'docker-compose.yml'
      - '.github/workflows/integration-testbed.yml'
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'scripts/testbed/**'
      - 'docker-compose.yml'
      - '.github/workflows/integration-testbed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testbed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combat:
    name: Combat test matrix (client vs DPI midbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build testbed images
        run: docker compose build --parallel

      - name: Start DPI midbox and target server
        run: docker compose up -d --wait dpi server

      - name: Run combat matrix
        run: |
          set +e
          docker compose run --rm --no-deps client | tee testbed-output.txt
          rc=${PIPESTATUS[0]}
          echo "matrix_rc=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Collect logs
        if: always()
        run: |
          mkdir -p testbed-logs
          docker compose logs dpi > testbed-logs/dpi.log 2>&1 || true
          docker compose logs server > testbed-logs/server.log 2>&1 || true
          cp testbed-output.txt testbed-logs/ 2>/dev/null || true
          docker compose ps >> testbed-logs/compose-ps.txt 2>&1 || true

      - name: Upload testbed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-logs
          path: testbed-logs/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Enforce result
        run: |
          echo "Combat matrix exit code: ${{ env.matrix_rc }}"
          test "${{ env.matrix_rc }}" = "0"
