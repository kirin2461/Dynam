name: NCP C++ Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libsodium-dev \
            libpcap-dev \
            libssl-dev \
            libnetfilter-queue-dev \
            libgtest-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TESTS=ON \
            -DENABLE_CLI=ON \
            -DENABLE_GUI=OFF \
            -DENABLE_LIBOQS=OFF \
            -DENABLE_WEBSOCKETS=OFF \
            -DENABLE_TOR_PROXY=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build_type }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libsodium openssl cmake

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=ON \
            -DENABLE_CLI=ON \
            -DENABLE_GUI=OFF \
            -DENABLE_LIBOQS=OFF \
            -DENABLE_WEBSOCKETS=OFF \
            -DENABLE_TOR_PROXY=OFF

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libsodium-ws-x64-windows-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install vcpkg and dependencies
        shell: cmd
        run: |
          if not exist C:\vcpkg\vcpkg.exe (
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          )
          C:\vcpkg\vcpkg install libsodium:x64-windows

      - name: Download Npcap SDK
        run: |
          $maxRetries = 5; $retryDelay = 15
          $url = 'https://npcap.com/dist/npcap-sdk-1.13.zip'
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              # npcap.com intermittently rejects requests from CI IPs
              # without a browser-like User-Agent
              Invoke-WebRequest -Uri $url -OutFile npcap-sdk.zip -TimeoutSec 90 -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
              break
            } catch {
              Write-Host "Attempt $i (Invoke-WebRequest) failed: $_"
              try {
                & curl.exe -fSL --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -o npcap-sdk.zip $url
                if ($LASTEXITCODE -eq 0) { break }
                Write-Host "Attempt $i (curl) exit code: $LASTEXITCODE"
              } catch {
                Write-Host "Attempt $i (curl) failed: $_"
              }
              if ($i -eq $maxRetries) { throw "Failed to download Npcap SDK after $maxRetries attempts" }
              Start-Sleep -Seconds $retryDelay
            }
          }
          # -Force: the repo vendors npcap-sdk/, so the destination exists
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk -Force

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DNPCAP_SDK_DIR="${{ github.workspace }}/npcap-sdk" `
            -DENABLE_TESTS=ON `
            -DENABLE_CLI=ON `
            -DENABLE_GUI=OFF `
            -DENABLE_LIBOQS=OFF `
            -DENABLE_WEBSOCKETS=OFF `
            -DENABLE_TOR_PROXY=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Copy DLLs for tests
        shell: pwsh
        run: |
          $testBin = "build/bin/Release"
          if (-not (Test-Path $testBin)) {
            New-Item -ItemType Directory -Path $testBin -Force | Out-Null
          }
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" $testBin -Force
          }

      - name: Run tests
        working-directory: build
        run: ctest -C Release --output-on-failure
